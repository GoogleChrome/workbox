version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
